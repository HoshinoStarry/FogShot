name: Build FogShot

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: host.hoshino.fogshot
  FLUTTER_VERSION: '3.50.1'
  FLUTTER_REVISION: ae9b586f34a8443573f82ef57c3bf914a908cbf7

jobs:
  build:
    name: ${{ matrix.target }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows, arch: x64, runner: windows-2025-vs2026}
          - {target: windows, arch: arm64, runner: windows-11-vs2026-arm}
          - {target: linux, arch: x64, runner: ubuntu-24.04}
          - {target: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {target: macos, arch: universal, runner: macos-15}
          - {target: ios-device, arch: arm64, runner: macos-15}
          - {target: android, arch: split-apk, runner: ubuntu-24.04}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        run: |
          sdk="$RUNNER_TEMP/flutter"
          git -c advice.detachedHead=false clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$sdk"
          test "$(git -C "$sdk" rev-parse HEAD)" = "$FLUTTER_REVISION"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cygpath -w "$sdk/bin" >> "$GITHUB_PATH"
          else
            printf '%s\n' "$sdk/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Set up JDK 17
        if: matrix.target == 'android'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'

      - name: Resolve locked packages
        run: |
          flutter --version
          flutter pub get --enforce-lockfile

      - name: Analyze
        if: matrix.target == 'windows' && matrix.arch == 'x64'
        run: flutter analyze --no-pub --fatal-infos

      - name: Build Windows portable package
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          flutter build windows --release --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = "build/windows/$env:TARGET_ARCH/runner/Release"
          $expected = if ($env:TARGET_ARCH -eq 'arm64') { 0xAA64 } else { 0x8664 }
          foreach ($file in @('fogshot.exe', 'rincast_backend.dll')) {
            $data = [IO.File]::ReadAllBytes((Resolve-Path "$bundle/$file").Path)
            $machine = [BitConverter]::ToUInt16($data, [BitConverter]::ToInt32($data, 0x3c) + 4)
            if ($machine -ne $expected) { throw "Unexpected architecture in $file" }
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "$bundle/*" -DestinationPath "dist/FogShot-windows-$env:TARGET_ARCH.zip"

      - name: Widget and input tests
        if: matrix.target == 'windows' && matrix.arch == 'x64'
        run: flutter test --no-pub

      - name: Build Linux bundle
        if: matrix.target == 'linux'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          flutter build linux --release --no-pub --target-platform "linux-$TARGET_ARCH"
          bundle="build/linux/$TARGET_ARCH/release/bundle"
          expected='x86-64'
          if [[ "$TARGET_ARCH" == arm64 ]]; then expected='ARM aarch64'; fi
          file "$bundle/fogshot" | grep -F "$expected"
          file "$bundle/lib/librincast_backend.so" | grep -F "$expected"
          mkdir -p dist
          tar -czf "dist/FogShot-linux-$TARGET_ARCH.tar.gz" -C "$bundle" .

      - name: Build macOS universal app
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release --no-pub
          app="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$plist")" = "$APP_ID"
          executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$plist")"
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          backend="$(find "$app/Contents/Frameworks" -type f -name 'rincast_backend' -print -quit)"
          lipo "$backend" -verify_arch arm64 x86_64
          mkdir -p dist
          ditto -c -k --keepParent "$app" dist/FogShot-macos-universal.zip

      - name: Build unsigned iOS device app
        if: matrix.target == 'ios-device'
        run: |
          flutter build ios --release --no-pub --no-codesign
          app="$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "$APP_ID"
          executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")"
          lipo "$app/$executable" -verify_arch arm64
          backend="$(find "$app/Frameworks" -type f -name 'rincast_backend' -print -quit)"
          lipo "$backend" -verify_arch arm64
          mkdir -p dist
          ditto -c -k --keepParent "$app" dist/FogShot-ios-arm64-unsigned.zip

      - name: Build Android release APKs by ABI
        if: matrix.target == 'android'
        run: |
          flutter build apk --release --no-pub --split-per-abi --target-platform android-arm,android-arm64,android-x64
          mkdir -p dist
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            "$sdk/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='$APP_ID'"
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/librincast_backend.so"
            cp "$apk" "dist/FogShot-android-$abi.apk"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FogShot-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
