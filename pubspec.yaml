name: fogshot
description: A Flutter desktop-streaming client for RinCast Streamer.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.1'

dependencies:
  flutter:
    sdk: flutter
  code_assets: ^2.1.0
  ffi: ^2.2.0
  flutter_secure_storage: ^11.2.0
  hooks: ^2.2.0
  logging: ^1.3.0
  material_ui: ^1.8.0
  native_toolchain_cmake: 0.3.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - licenses/

hooks:
  user_defines:
    fogshot:
      android:
        ndk_version: '28.2.13676358'
